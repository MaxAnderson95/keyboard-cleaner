  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <rect x="282" y="300" width="460" height="460" rx="92" fill="#000000" opacity="0.35" transform="translate(0 24)"/>
  <rect x="282" y="300" width="460" height="440" rx="88" fill="url(#capSide)"/>
  <rect x="282" y="262" width="460" height="440" rx="88" fill="url(#cap)"/>

  <g clip-path="url(#capClip)">
